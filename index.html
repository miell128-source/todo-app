<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="탭별로 관리하는 간단한 할 일 목록">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>TO DO</title>
  <style>
    :root { color-scheme: light; --line:#e5e7eb; --muted:#8a8f98; --text:#20242a; --accent:#F5B5A7; --bg:#fff; --soft:#f7f8fa; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:680px; margin:0 auto; padding:22px 16px max(24px, env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    h1 { font-size:21px; margin:0; letter-spacing:.02em; }
    #summary { font-size:12px; color:var(--muted); }
    .tabs-wrap { display:flex; align-items:center; gap:7px; margin-bottom:18px; }
    #tabs, #memoTabs { display:flex; gap:6px; overflow-x:auto; flex:1; min-width:0; scrollbar-width:thin; padding:2px 1px 7px; }
    .tab-wrap { flex:0 0 auto; display:flex; align-items:center; border:1px solid var(--line); border-radius:9px; background:var(--soft); overflow:hidden; }
    .tab { max-width:150px; padding:9px 11px; border:0; background:transparent; color:var(--muted); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tab-wrap.active { background:#FFF0EC; border-color:#F5B5A7; }
    .tab-wrap.active .tab { color:#A85C4D; font-weight:700; }
    .tab-delete { border:0; background:transparent; color:var(--muted); padding:7px 8px; font-size:16px; line-height:1; }
    .tab.active { background:#FFF0EC; border-color:#F5B5A7; color:#A85C4D; font-weight:700; }
    #addTab, #addMemo { flex:0 0 auto; width:36px; height:36px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--accent); font-size:22px; line-height:1; box-shadow:0 1px 3px #0000000d; display:inline-flex; align-items:center; justify-content:center; padding:0; }
    .head,.item { display:grid; grid-template-columns:minmax(65px, 24%) minmax(0,1fr) 42px 28px; gap:8px; align-items:center; }
    .head { padding:10px 8px; border-bottom:2px solid #F5B5A7; color:var(--muted); font-size:12px; font-weight:650; }
    .head div:nth-child(3) { text-align:center; }
    #list { display:flex; flex-direction:column; }
    .item { min-height:54px; padding:8px; border-bottom:1px solid var(--line); }
    .item input[type="text"] { width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:14px; padding:7px 2px; border-radius:5px; }
    .item input[type="text"]:focus { background:#FFF7F4; box-shadow:0 0 0 1px #F5B5A7; }
    .item input[type="checkbox"] { width:20px; height:20px; accent-color:var(--accent); cursor:pointer; }
    .check { display:flex; justify-content:center; align-items:center; }
    .delete-item { border:0; background:transparent; color:var(--muted); font-size:18px; padding:5px; }
    .main-switch { display:flex; gap:8px; margin:0 0 18px; padding:4px; background:var(--soft); border:1px solid var(--line); border-radius:12px; }
    .main-switch button { flex:1; border:0; border-radius:9px; padding:11px; background:transparent; color:var(--muted); font-weight:650; }
    .main-switch button.active { background:var(--bg); color:var(--accent); box-shadow:0 1px 4px #00000012; }
    .main-switch button#showTrash { flex:0 0 46px; display:flex; align-items:center; justify-content:center; }
    .trash-section { display:none; } .trash-section.visible { display:block; }
    .trash-entry { border:1px solid var(--line); border-radius:10px; padding:12px; margin:0 0 9px; display:flex; align-items:center; gap:10px; }
    .trash-entry .trash-info { flex:1; min-width:0; font-size:13px; }
    .trash-entry small { display:block; color:var(--muted); margin-top:4px; }
    .trash-entry button { border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:7px 9px; font-size:12px; }
    #emptyTrash { border:1px solid var(--line); border-radius:9px; background:var(--soft); padding:9px 12px; color:var(--muted); font-size:12px; }
    #exportMemo { width:36px; height:36px; flex:0 0 36px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:#747B24; display:inline-flex; align-items:center; justify-content:center; box-shadow:0 1px 3px #0000000d; padding:0; }
    .memo-section { display:none; }
    .memo-section.visible { display:block; }
    .todo-section.hidden { display:none; }
    .memo-editor { border:1px solid var(--line); border-radius:11px; padding:14px; background:var(--bg); }
    .memo-title { width:100%; border:0; border-bottom:1px solid var(--line); outline:0; background:transparent; color:var(--text); font:inherit; font-weight:700; font-size:16px; padding:7px 2px 12px; margin-bottom:10px; }
    .memo-body { width:100%; min-height:280px; resize:vertical; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:14px; line-height:1.7; }
    .memo-actions { display:flex; justify-content:flex-end; margin-top:8px; }
    .delete-memo { border:0; background:transparent; color:var(--muted); font-size:13px; padding:7px 8px; }
    .item.done input[type="text"] { color:var(--muted); text-decoration:line-through; }
    /* TO DO: #F5B5A7 / MEMO: #DDE67B / 공통 음영·구분선: 중성 회색 */
    body.memo-mode { --accent:#DDE67B; }
    body.memo-mode #showMemos.active { color:#747B24; background:#F5F7D9; }
    body.memo-mode #addMemo { color:#747B24; }
    body.memo-mode #memoTabs .tab-wrap.active { background:#F5F7D9; border-color:#DDE67B; }
    body.memo-mode #memoTabs .tab-wrap.active .tab { color:#747B24; }
    body.memo-mode .memo-editor { border-color:#DDE67B; }
    body.memo-mode .memo-title:focus, body.memo-mode .memo-body:focus { box-shadow:0 0 0 1px #DDE67B; border-radius:4px; }
    body.memo-mode .delete-memo { color:#747B24; }
    .actions { display:flex; gap:8px; margin-top:18px; }
    button { font:inherit; cursor:pointer; }
    #add { flex:1; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--soft); color:var(--text); font-size:14px; font-weight:650; }
    #export { border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text); font-size:12px; padding:8px 11px; white-space:nowrap; }
    #clear { border:0; background:transparent; color:var(--muted); font-size:12px; padding:8px; }
    .hint { color:var(--muted); font-size:11px; text-align:center; margin:18px 0 0; line-height:1.6; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme:dark; --line:#343840; --muted:#a0a5af; --text:#f0f1f3; --bg:#17191d; --soft:#22252b; }
      .item input[type="text"]:focus { background:#332522; box-shadow:0 0 0 1px #A85C4D; }
      .tab.active { background:#382925; border-color:#A85C4D; color:#FFD8CF; }
    }
  </style>
</head>
<body>
<main>
  <header><h1 id="pageTitle">TO DO</h1><div id="summary">0개 · 완료 0개</div></header>
  <nav class="main-switch" aria-label="메인 메뉴">
    <button id="showTodo" class="active" type="button">TO DO</button>
    <button id="showMemos" type="button">MEMO</button>
    <button id="showTrash" type="button" aria-label="휴지통" title="휴지통"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2m-11 0 1 15h12l1-15M10 11v6m4-6v6"/></svg></button>
  </nav>
  <div id="todoSection" class="todo-section">
  <div class="tabs-wrap">
    <nav id="tabs" aria-label="TO DO 탭"></nav>
    <button id="addTab" type="button" aria-label="새 탭 만들기" title="새 탭 만들기">＋</button>
  </div>
  <section aria-label="할 일 목록">
    <div class="head"><div>날짜·순번</div><div>할 일</div><div>완료</div></div>
    <div id="list"></div>
  </section>
  <div class="actions">
    <button id="add" type="button">＋ 할 일 추가</button>
    <button id="export" type="button">내보내기</button>
    <button id="clear" type="button">전체 비우기</button>
  </div>
  </div>
  <section id="memoSection" class="memo-section" aria-label="메모 게시판">
    <div class="tabs-wrap">
      <nav id="memoTabs" aria-label="메모 탭"></nav>
      <button id="addMemo" type="button" aria-label="새 메모 만들기" title="새 메모 만들기">＋</button>
      <button id="exportMemo" type="button" aria-label="전체 내보내기" title="TO DO와 MEMO 내보내기"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button>
    </div>
    <div class="memo-editor">
      <input id="memoTitle" class="memo-title" type="text" placeholder="메모 제목">
      <textarea id="memoBody" class="memo-body" placeholder="내용을 자유롭게 적어두세요."></textarea>
      <div class="memo-actions"><button id="deleteMemo" class="delete-memo" type="button">이 메모 삭제 ×</button></div>
    </div>
  </section>
  <section id="trashSection" class="trash-section" aria-label="휴지통"><div id="trashList"></div><div class="actions"><button id="emptyTrash" type="button">휴지통 비우기</button></div></section>
  <p class="hint">내용은 이 기기에 자동 저장됩니다.<br>탭 이름을 두 번 누르면 이름을 바꿀 수 있어요.</p>
</main>
<script>
(() => {
  const STORAGE_KEY = 'simple-todo-pwa-tabs-v2';
  const LEGACY_KEY = 'simple-todo-pwa-v1';
  const list = document.getElementById('list');
  const summary = document.getElementById('summary');
  const tabsEl = document.getElementById('tabs');
  const memoTabsEl = document.getElementById('memoTabs');
  const memoTitleEl = document.getElementById('memoTitle');
  const memoBodyEl = document.getElementById('memoBody');
  let currentPage = 'todo';
  let state;
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (saved && Array.isArray(saved.tabs) && saved.tabs.length) {
      state = saved;
      // 이전 버전의 메모 목록을 독립적인 메모 탭으로 이전합니다.
      if (!Array.isArray(state.memoTabs)) {
        const oldMemos = Array.isArray(state.memos) ? state.memos : [];
        state.memoTabs = oldMemos.length ? oldMemos : [{ id: 'memo-' + Date.now(), title: '새 메모', body: '' }];
        state.activeMemoId = state.memoTabs[0].id;
      }
      if (!state.activeMemoId || !state.memoTabs.some(m => m.id === state.activeMemoId)) state.activeMemoId = state.memoTabs[0]?.id || null;
      delete state.memos;
    } else {
      // 기존 단일 목록을 첫 탭으로 옮겨 기존 할 일을 보존합니다.
      let oldItems = [];
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || '[]');
        if (Array.isArray(legacy)) oldItems = legacy;
      } catch (_) {}
      state = { activeId: 'tab-1', tabs: [{ id: 'tab-1', name: 'TO DO', items: oldItems }], memoTabs: [{ id: 'memo-' + Date.now(), title: '새 메모', body: '' }] , activeMemoId: null }; state.activeMemoId = state.memoTabs[0].id;
      persist();
    }
  } catch (_) {
    state = { activeId: 'tab-1', tabs: [{ id: 'tab-1', name: 'TO DO', items: [] }], memoTabs: [{ id: 'memo-' + Date.now(), title: '새 메모', body: '' }] }; state.activeMemoId = state.memoTabs[0].id;
  }

  if (!Array.isArray(state.trash)) state.trash = [];
  function activeTab() {
    return state.tabs.find(tab => tab.id === state.activeId) || state.tabs[0];
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (_) { alert('저장 공간에 문제가 있어 저장하지 못했어요.'); }
  }
  function renderTabs() {
    tabsEl.replaceChildren();
    state.tabs.forEach(tab => {
      const wrap = document.createElement('div');
      wrap.className = 'tab-wrap' + (tab.id === state.activeId ? ' active' : '');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab';
      button.textContent = tab.name;
      button.title = '두 번 누르면 이름 변경';
      button.addEventListener('click', () => { state.activeId = tab.id; persist(); render(); });
      button.addEventListener('dblclick', () => {
        const next = prompt('탭 이름을 입력하세요.', tab.name);
        if (next !== null && next.trim()) { tab.name = next.trim(); persist(); renderTabs(); }
      });
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'tab-delete'; del.textContent = '×';
      del.title = '탭 삭제'; del.setAttribute('aria-label', `${tab.name} 탭 삭제`);
      del.addEventListener('click', () => {
        if (!confirm(`'${tab.name}' 탭과 그 안의 할 일을 휴지통으로 이동할까요?`)) return;
        state.trash.push({ type:'todoTab', data:tab, deletedAt:Date.now() });
        state.tabs = state.tabs.filter(x => x.id !== tab.id);
        if (!state.tabs.length) state.tabs.push({ id: 'tab-' + Date.now(), name: 'TO DO', items: [] });
        if (state.activeId === tab.id) state.activeId = state.tabs[0].id;
        persist(); render();
      });
      wrap.append(button, del); tabsEl.append(wrap);
    });
  }
  function activeMemo() { return state.memoTabs.find(m => m.id === state.activeMemoId) || state.memoTabs[0]; }
  function renderMemoTabs() {
    memoTabsEl.replaceChildren();
    state.memoTabs.forEach(memo => {
      const wrap = document.createElement('div');
      wrap.className = 'tab-wrap' + (memo.id === state.activeMemoId ? ' active' : '');
      const button = document.createElement('button'); button.type = 'button'; button.className = 'tab';
      button.textContent = memo.title?.trim() || '제목 없는 메모'; button.title = '두 번 누르면 제목 변경';
      button.addEventListener('click', () => { saveActiveMemoFields(); state.activeMemoId = memo.id; persist(); renderMemoPage(); });
      button.addEventListener('dblclick', () => {
        const next = prompt('메모 탭 이름을 입력하세요.', memo.title || '');
        if (next !== null && next.trim()) { memo.title = next.trim(); persist(); renderMemoPage(); }
      });
      const del = document.createElement('button'); del.type = 'button'; del.className = 'tab-delete'; del.textContent = '×'; del.title = '메모 삭제';
      del.addEventListener('click', () => deleteMemo(memo));
      wrap.append(button, del); memoTabsEl.append(wrap);
    });
  }
  function saveActiveMemoFields() {
    const memo = activeMemo(); if (!memo) return;
    memo.title = memoTitleEl.value; memo.body = memoBodyEl.value; persist();
  }
  function renderMemoPage() {
    if (!state.memoTabs.length) state.memoTabs.push({ id: 'memo-' + Date.now(), title: '새 메모', body: '' });
    if (!state.activeMemoId || !state.memoTabs.some(m => m.id === state.activeMemoId)) state.activeMemoId = state.memoTabs[0].id;
    const memo = activeMemo();
    renderMemoTabs();
    memoTitleEl.value = memo.title || '';
    memoBodyEl.value = memo.body || '';
    document.getElementById('summary').textContent = `${state.memoTabs.length}개 메모`;
  }
  function deleteMemo(memo) {
    if (!confirm(`'${memo.title || '제목 없는 메모'}'를 휴지통으로 이동할까요?`)) return;
    state.trash.push({ type:'memo', data:memo, deletedAt:Date.now() });
    state.memoTabs = state.memoTabs.filter(x => x.id !== memo.id);
    if (!state.memoTabs.length) state.memoTabs.push({ id: 'memo-' + Date.now(), title: '새 메모', body: '' });
    if (state.activeMemoId === memo.id) state.activeMemoId = state.memoTabs[0].id;
    persist(); renderMemoPage();
  }
  function showPage(page) {
    currentPage = page;
    document.body.classList.toggle('memo-mode', page === 'memo');
    document.getElementById('todoSection').classList.toggle('hidden', page !== 'todo');
    document.getElementById('memoSection').classList.toggle('visible', page === 'memo');
    document.getElementById('trashSection').classList.toggle('visible', page === 'trash');
    document.getElementById('showTodo').classList.toggle('active', page === 'todo');
    document.getElementById('showMemos').classList.toggle('active', page === 'memo');
    document.getElementById('showTrash').classList.toggle('active', page === 'trash');
    document.getElementById('pageTitle').textContent = page === 'todo' ? 'TO DO' : page === 'memo' ? 'MEMO' : '휴지통';
    if (page === 'memo') renderMemoPage(); else if (page === 'trash') renderTrash(); else render();
  }
  function render(focusLast = false) {
    const tab = activeTab();
    const items = tab.items;
    renderTabs();
    list.replaceChildren();
    items.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'item' + (item.done ? ' done' : '');

      const marker = document.createElement('input');
      marker.type = 'text';
      marker.placeholder = '날짜·순번';
      marker.setAttribute('aria-label', `${index + 1}번 날짜 또는 순번`);
      marker.value = item.marker || '';
      marker.addEventListener('input', () => { item.marker = marker.value; persist(); });

      const task = document.createElement('input');
      task.type = 'text';
      task.placeholder = '할 일을 입력하세요';
      task.setAttribute('aria-label', `${index + 1}번 할 일`);
      task.value = item.task || '';
      task.addEventListener('input', () => { item.task = task.value; persist(); });

      const checkWrap = document.createElement('label');
      checkWrap.className = 'check';
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.checked = !!item.done;
      check.setAttribute('aria-label', `${index + 1}번 완료`);
      check.addEventListener('change', () => {
        item.done = check.checked;
        persist();
        render();
      });
      checkWrap.append(check);
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'delete-item'; del.textContent = '×'; del.title = '할 일 삭제';
      del.setAttribute('aria-label', `${index + 1}번 할 일 삭제`);
      del.addEventListener('click', () => { if (confirm('이 할 일을 휴지통으로 이동할까요?')) { const removed = items.splice(index, 1)[0]; state.trash.push({ type:'todoItem', data:removed, tabId:tab.id, tabName:tab.name, index, deletedAt:Date.now() }); persist(); render(); } });
      row.append(marker, task, checkWrap, del);
      list.append(row);
    });
    const completed = items.filter(x => x.done).length;
    summary.textContent = `${items.length}개 · 완료 ${completed}개`;
    if (focusLast) {
      const fields = list.querySelectorAll('input[type="text"]');
      fields[fields.length - 1]?.focus();
    }
  }

  document.getElementById('addTab').addEventListener('click', () => {
    const name = prompt('새 TO DO 탭 이름을 입력하세요.');
    if (name === null || !name.trim()) return;
    const id = 'tab-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    state.tabs.push({ id, name: name.trim(), items: [] });
    state.activeId = id;
    persist();
    render();
  });

  document.getElementById('addMemo').addEventListener('click', () => {
    saveActiveMemoFields();
    const memo = { id: 'memo-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), title: '새 메모', body: '' };
    state.memoTabs.push(memo); state.activeMemoId = memo.id; persist(); renderMemoPage(); memoTitleEl.focus();
  });
  memoTitleEl.addEventListener('input', () => { const memo = activeMemo(); if (memo) { memo.title = memoTitleEl.value; persist(); renderMemoTabs(); } });
  memoBodyEl.addEventListener('input', () => { const memo = activeMemo(); if (memo) { memo.body = memoBodyEl.value; persist(); } });
  document.getElementById('deleteMemo').addEventListener('click', () => { const memo = activeMemo(); if (memo) deleteMemo(memo); });
  document.getElementById('showTodo').addEventListener('click', () => showPage('todo'));
  document.getElementById('showMemos').addEventListener('click', () => showPage('memo'));

  document.getElementById('add').addEventListener('click', () => {
    activeTab().items.push({ marker: '', task: '', done: false });
    persist();
    render(true);
  });

  function exportAll() {
    const lines = ['TO DO 백업', `내보낸 날짜: ${new Date().toLocaleString('ko-KR')}`, ''];
    state.tabs.forEach((tab, tabIndex) => {
      lines.push(`[${tab.name}]`);
      if (!tab.items.length) {
        lines.push('(할 일 없음)');
      } else {
        tab.items.forEach(item => {
          const marker = (item.marker || '').trim();
          const task = (item.task || '').trim();
          if (!marker && !task) return;
          const status = item.done ? '☑' : '□';
          lines.push(`${status} ${marker}${marker && task ? '  ' : ''}${task}`);
        });
      }
      if (tabIndex < state.tabs.length - 1) lines.push('');
    });
    if (state.memoTabs.length) {
      lines.push('', '========== MEMO ==========');
      state.memoTabs.forEach(memo => {
        lines.push('', `[${(memo.title || '제목 없는 메모').trim()}]`);
        lines.push((memo.body || '').trim() || '(내용 없음)');
      });
    }
    const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const now = new Date();
    const date = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, '0'), String(now.getDate()).padStart(2, '0')].join('-');
    link.href = url;
    link.download = `TO-DO-${date}.txt`;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  document.getElementById('export').addEventListener('click', exportAll);
  document.getElementById('exportMemo').addEventListener('click', exportAll);

  document.getElementById('clear').addEventListener('click', () => {
    const items = activeTab().items;
    if (items.length && confirm(`'${activeTab().name}' 탭의 할 일을 모두 비울까요?`)) {
      activeTab().items = [];
      persist();
      render();
    }
  });

  function renderTrash() {
    const el = document.getElementById('trashList'); el.replaceChildren();
    if (!state.trash.length) { const p=document.createElement('p'); p.className='hint'; p.textContent='휴지통이 비어 있어요.'; el.append(p); return; }
    state.trash.slice().reverse().forEach((entry, reverseIndex) => {
      const index = state.trash.length - 1 - reverseIndex;
      const row=document.createElement('div'); row.className='trash-entry';
      const info=document.createElement('div'); info.className='trash-info';
      const title = entry.type==='todoTab' ? `TO DO 탭 · ${entry.data.name}` : entry.type==='memo' ? `MEMO · ${entry.data.title || '제목 없는 메모'}` : `할 일 · ${entry.data.task || '(내용 없음)'}`;
      info.textContent=title;
      const detail=document.createElement('small'); detail.textContent=entry.type==='todoItem' ? `원래 위치: ${entry.tabName}` : entry.type==='todoTab' ? `할 일 ${entry.data.items.length}개 포함` : '메모'; info.append(detail);
      const restore=document.createElement('button'); restore.textContent='복구'; restore.addEventListener('click',()=>{
        if(entry.type==='todoTab') { if(!state.tabs.some(t=>t.id===entry.data.id)) state.tabs.push(entry.data); }
        else if(entry.type==='memo') { if(!state.memoTabs.some(m=>m.id===entry.data.id)) state.memoTabs.push(entry.data); }
        else { let target=state.tabs.find(t=>t.id===entry.tabId); if(!target) { target={id:'tab-'+Date.now(),name:entry.tabName || '복구한 탭',items:[]}; state.tabs.push(target); } target.items.splice(Math.min(entry.index,target.items.length),0,entry.data); }
        state.trash.splice(index,1); persist(); renderTrash();
      });
      const remove=document.createElement('button'); remove.textContent='영구 삭제'; remove.addEventListener('click',()=>{ if(confirm('이 항목을 영구 삭제할까요?')) { state.trash.splice(index,1); persist(); renderTrash(); } });
      row.append(info,restore,remove); el.append(row);
    });
  }
  document.getElementById('showTrash').addEventListener('click',()=>showPage('trash'));
  document.getElementById('emptyTrash').addEventListener('click',()=>{ if(state.trash.length && confirm('휴지통을 완전히 비울까요? 복구할 수 없습니다.')) { state.trash=[]; persist(); renderTrash(); } });

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  render();
  renderMemoPage();
  showPage('todo');
})();
</script>
</body>
</html>
